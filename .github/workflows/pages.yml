name: Publish Dot Globe
# サイトのファイルをgh-pagesブランチに書き出す。Pagesの公開元はgh-pagesブランチ。
on:
  push:
    branches: [main]
  workflow_run:
    # 問題データの更新コミットはGITHUB_TOKENで作られるためpushでは起動しない。
    workflows: [Refresh question data]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Push site to gh-pages
        run: |
          mkdir site
          cp index.html coastline.json site/
          if [ -f questions.json ]; then cp questions.json site/; fi
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
