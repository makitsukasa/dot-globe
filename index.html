<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dot Globe — 点だけ地理クイズ</title><style>body{margin:0;background:#080f1e;color:#eaf3ff;font:15px system-ui}header{padding:16px 24px;border-bottom:1px solid #24344e;display:flex;justify-content:space-between}main{display:grid;grid-template-columns:minmax(300px,1fr) 310px;min-height:calc(100vh - 65px)}canvas{width:100%;height:75vh;touch-action:none;cursor:grab}aside{padding:24px;background:#101c2e;border-left:1px solid #273c59}h1{font-size:20px;margin:0}h2{font-size:21px}button{width:100%;padding:13px;margin:6px 0;border-radius:9px;border:1px solid #426080;background:#192e48;color:#eaf3ff;text-align:left;cursor:pointer}button:hover{background:#294867}button:disabled{opacity:.5}button.correct{background:#155a45}button.wrong{background:#71323c}.small{font-size:12px;color:#9bb3d0}.toolbar{padding:0 22px 20px;display:flex;gap:12px;flex-wrap:wrap}.toolbar button{width:auto}#status{min-height:55px;line-height:1.7}#counter{color:#a3c9ef}@media(max-width:750px){main{display:flex;flex-direction:column}canvas{height:55vh}aside{border:0;border-top:1px solid #273c59}}</style><header><h1>DOT GLOBE <span class="small">点だけ地理クイズ</span></h1><span id="counter"></span></header><main><section><canvas id="globe"></canvas><div class="toolbar"><button id="next">次の問題 →</button><button id="reveal">答え・地球を表示</button><button id="reset">向きを戻す</button><button id="collect">データを再収集（管理・実験用）</button><button id="export">問題JSONを保存</button><label style="padding:12px;border:1px solid #426080;border-radius:8px">問題JSONを読み込む <input id="import" type="file" accept=".json,application/json" style="max-width:180px"></label></div><p class="small" style="padding:0 24px">ドラッグ：回転　ホイール：拡大縮小　公開済み問題集は自動で読み込みます。再収集ボタンは実験用です。国別・地域別の空港問題は生成しません。取得後はJSONとして保存できます。</p></section><aside><div class="small" id="question"></div><h2>この点群は何でしょう？</h2><p id="count"></p><div id="answers"></div><p id="status"></p><p {name:'世界の著名な古代遺跡',points:[[29.98,31.13],[30.33,35.44],[20.68,-88.57],[17.22,-89.62],[41.89,12.49],[37.97,23.73],[37.18,38.89],[31.77,35.23],[27.17,78.04],[-13.16,-72.55],[13.41,103.87],[51.18,-1.83],[29.93,52.89],[27.33,68.14],[-27.12,-109.37],[38.44,22.5],[37.07,15.29]]},

{name:'世界の主要な首都',points:[[35.68,139.69],[38.9,-77.04],[51.51,-.13],[48.86,2.35],[52.52,13.4],[39.9,116.4],[28.61,77.21],[-15.79,-47.88],[-35.28,149.13],[55.75,37.62],[30.04,31.24],[-1.29,36.82],[39.93,32.86],[37.57,126.98],[19.43,-99.13],[9.08,7.4],[59.91,10.75],[41.9,12.5]]},

];
const wikidataCategories=[
["世界の灯台","Q39715"],["世界の火山","Q8072"],["世界の博物館","Q33506"],["世界の大学","Q3918"],["世界の動物園","Q43501"],["世界の植物園","Q167346"],["世界の城","Q23413"],["世界のダム","Q12323"],["世界の水族館","Q2281788"],["世界の国立公園","Q46169"],["世界の天文台","Q62832"],["世界の大聖堂","Q2977"],["世界の美術館","Q207694"],["世界の橋","Q12280"],["世界のスタジアム","Q483110"],["世界の鉄道駅","Q55488"],["世界の発電所","Q159719"],["世界の滝","Q34038"],["世界の洞窟","Q35509"],["世界の考古遺跡","Q839954"],["世界の空港","Q1248784"]
];
// 点数がこの範囲外の候補は問題にしない（scripts/collect.pyと同じ値）。多すぎる候補は間引かずに除外する。
const MIN_POINTS=30,MAX_POINTS=3000;
let coastline=[];
let index=0, answered=false, reveal=false, zoom=1, dragging=false, last=null;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function rad(v){return v*Math.PI/180}
function mul(a,b){return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]]}
function randomRotation(){let u=Math.random(),v=Math.random(),w=Math.random();return [Math.sqrt(u)*Math.cos(2*Math.PI*w),Math.sqrt(1-u)*Math.sin(2*Math.PI*v),Math.sqrt(1-u)*Math.cos(2*Math.PI*v),Math.sqrt(u)*Math.sin(2*Math.PI*w)]}
let rotation=[1,0,0,0],initialRotation=rotation.slice();
function axisRotation(x,y,z,angle){let h=angle/2,k=Math.sin(h);return [Math.cos(h),x*k,y*k,z*k]}
function point(lat,lon){let a=rad(lat),b=rad(lon),x=Math.cos(a)*Math.sin(b),y=Math.sin(a),z=Math.cos(a)*Math.cos(b);let q=rotation,t=mul(mul(q,[0,x,y,z]),[q[0],-q[1],-q[2],-q[3]]);return [t[1],t[2],t[3]]}
function draw(){let dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);let r=Math.min(w,h)*.4*zoom,cx=w/2,cy=h/2;let bg=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r);bg.addColorStop(0,'#163858');bg.addColorStop(1,'#091628');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4d7495';ctx.globalAlpha=.5;ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1;
if(reveal){ctx.strokeStyle='#355676';ctx.lineWidth=.6;for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();let active=false;for(let lon=-180;lon<=180;lon+=2){let p=point(lat,lon);if(p[2]>=0){let x=cx+p[0]*r,y=cy-p[1]*r;if(!active)ctx.moveTo(x,y);else ctx.lineTo(x,y);active=true}else active=false}ctx.stroke()}for(let lon=-180;lon<180;lon+=30){ctx.beginPath();let active=false;for(let lat=-90;lat<=90;lat+=2){let p=point(lat,lon);if(p[2]>=0){let x=cx+p[0]*r,y=cy-p[1]*r;if(!active)ctx.moveTo(x,y);else ctx.lineTo(x,y);active=true}else active=false}ctx.stroke()}ctx.strokeStyle='#7fa6c4';ctx.lineWidth=1;for(let line of coastline){ctx.beginPath();let active=false;for(let i=0;i<line.length;i+=2){let p=point(line[i+1],line[i]);if(p[2]>=0){let x=cx+p[0]*r,y=cy-p[1]*r;if(!active)ctx.moveTo(x,y);else ctx.lineTo(x,y);active=true}else active=false}ctx.stroke()}}
for(let p of sets[index].points){let [x,y,z]=point(...p);if(z<0)continue;let px=cx+x*r,py=cy-y*r;ctx.shadowColor='#6ceeff';ctx.shadowBlur=9;ctx.fillStyle='#8beaff';ctx.beginPath();ctx.arc(px,py,Math.max(2.5,3.3*zoom),0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}
function load(){answered=false;reveal=false;rotation=randomRotation();initialRotation=rotation.slice();zoom=1;document.querySelector('#question').textContent=`QUESTION ${index+1} / ${sets.length}`;document.querySelector('#counter').textContent=`${index+1} / ${sets.length}`;document.querySelector('#count').textContent=`地点数：${sets[index].points.length}点`;document.querySelector('#status').textContent='点の位置から推理してください。';let pool=sets.map((_,i)=>i).filter(i=>i!==index);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let options=[index,...pool.slice(0,3)];for(let i=options.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}let el=document.querySelector('#answers');el.innerHTML='';for(let i of options){let b=document.createElement('button');b.textContent=sets[i].name;b.onclick=()=>{if(answered)return;answered=true;reveal=true;b.classList.add(i===index?'correct':'wrong');document.querySelector('#status').textContent=i===index?'正解です。':'不正解です。正解：'+sets[index].name;[...el.children].forEach(c=>{c.disabled=true;if(c.textContent===sets[index].name)c.classList.add('correct')});draw()};el.append(b)}draw()}
canvas.addEventListener('pointerdown',e=>{dragging=true;last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;rotation=mul(axisRotation(0,1,0,(e.clientX-last[0])*.008),rotation);rotation=mul(axisRotation(1,0,0,(e.clientY-last[1])*.008),rotation);last=[e.clientX,e.clientY];draw()});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.22,zoom*(e.deltaY>0?.93:1.07)));draw()},{passive:false});function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.length>1)rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function fingerprint(points){let a=new Float64Array(144);for(let [lat,lon] of points){let x=Math.min(23,Math.max(0,Math.floor((lon+180)/15))),y=Math.min(5,Math.max(0,Math.floor((lat+90)/30)));a[y*24+x]++}let total=points.length;return Array.from(a,v=>Math.sqrt(v/total))}
function similarity(a,b){return a.reduce((sum,v,i)=>sum+v*b[i],0)}
function generateAirportSets(csv){let rows=parseCSV(csv),header=rows.shift(),ix=Object.fromEntries(header.map((x,i)=>[x,i]));for(let key of ['latitude_deg','longitude_deg','type','iso_country','iso_region','elevation_ft','scheduled_service'])if(ix[key]===undefined)throw Error('必要な列がありません: '+key);let data=rows.map(r=>({lat:Number(r[ix.latitude_deg]),lon:Number(r[ix.longitude_deg]),type:r[ix.type],country:r[ix.iso_country],region:r[ix.iso_region],elev:Number(r[ix.elevation_ft]),scheduled:r[ix.scheduled_service]})).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon)&&Math.abs(x.lat)<=90&&Math.abs(x.lon)<=180);let candidates=[];function add(name,filter){let points=data.filter(filter).map(x=>[x.lat,x.lon]);if(points.length>=MIN_POINTS&&points.length<=MAX_POINTS)candidates.push({name,points})}let types=[['大型空港','large_airport'],['中型空港','medium_airport'],['小型空港','small_airport'],['ヘリポート','heliport'],['水上飛行場','seaplane_base'],['閉鎖された飛行場','closed'],['気球発着場','balloonport']];for(let [name,type] of types)add('世界の'+name,x=>x.type===type);add('定期便のある空港',x=>x.scheduled==='yes');add('標高1500m以上の飛行場',x=>x.elev>=4921);add('標高3000m以上の飛行場',x=>x.elev>=9843);add('海抜以下の飛行場',x=>x.elev<0);for(let [name,type] of types){add('定期便のある'+name,x=>x.type===type&&x.scheduled==='yes');add('標高1000m以上の'+name,x=>x.type===type&&x.elev>=3281)}// 国・地域による切り出しは禁止。輪郭がそのまま答えになるため。
let ranked=candidates.map(x=>({...x,fp:fingerprint(x.points)})).sort((a,b)=>Math.min(a.points.length,3000)-Math.min(b.points.length,3000));let kept=[];for(let x of ranked){if(kept.every(y=>similarity(x.fp,y.fp)<.90))kept.push(x)}return {raw:candidates.length,kept:kept.map(({name,points})=>({name,points})) ,records:data.length}}
async function collectWikidataCategory(name,qid){
 const query=`SELECT DISTINCT ?item ?coord WHERE { ?item wdt:P31/wdt:P279* wd:${qid}; wdt:P625 ?coord. } LIMIT ${MAX_POINTS+1}`;
 const url='https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(query);
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),14000);
 try{let r=await fetch(url,{headers:{Accept:'application/sparql-results+json'},signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);let json=await r.json(),points=[];
 for(let b of json.results.bindings){let m=/Point\((-?[\d.]+) (-?[\d.]+)\)/.exec(b.coord?.value||'');if(m){let lon=+m[1],lat=+m[2];if(Math.abs(lat)<=90&&Math.abs(lon)<=180)points.push([lat,lon])}}
 return points.length>=MIN_POINTS&&json.results.bindings.length<=MAX_POINTS?{name,points}:null;
 }finally{clearTimeout(timer)}
}
function dedupeCandidates(candidates,threshold=.88){let ranked=candidates.filter(x=>x.points.length>=MIN_POINTS&&x.points.length<=MAX_POINTS).map(x=>({...x,fp:fingerprint(x.points)})).sort((a,b)=>b.points.length-a.points.length),kept=[];
 for(let x of ranked)if(kept.every(y=>similarity(x.fp,y.fp)<threshold))kept.push(x);
 return kept.map(({name,points})=>({name,points}));}
document.querySelector('#collect').onclick=async()=>{let b=document.querySelector('#collect');b.disabled=true;let candidates=[],messages=[];
 try{
 b.textContent='空港データ取得中…';try{let r=await fetch('https://davidmegginson.github.io/ourairports-data/airports.csv');if(!r.ok)throw Error('HTTP '+r.status);let result=generateAirportSets(await r.text());candidates.push(...result.kept);messages.push('空港 '+result.kept.length+'件')}catch(e){messages.push('空港取得失敗: '+e.message)}
 for(let i=0;i<wikidataCategories.length;i++){
 let [name,qid]=wikidataCategories[i];b.textContent=`施設収集中 ${i+1}/${wikidataCategories.length}`;
 try{let result=await collectWikidataCategory(name,qid);if(result)candidates.push(result)}catch(e){messages.push(name+'取得失敗')}
 }
 let kept=dedupeCandidates(candidates);if(kept.length<4)throw Error('候補が4問未満でした。 '+messages.join(' / '));
 sets=kept;index=0;load();document.querySelector('#status').textContent=`${candidates.length}候補から類似分布を除いて${sets.length}問生成。${messages.join(' / ')}。判別性は未検証です。`;
 }catch(e){document.querySelector('#status').textContent='収集失敗: '+e.message}finally{b.disabled=false;b.textContent='空港・施設データを収集して問題生成'}
};
document.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,source:'Dot Globe',sets})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dot-globe-questions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#import').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text()),v=Array.isArray(obj)?obj:obj.sets;if(!Array.isArray(v)||v.length<4||v.some(x=>typeof x.name!=='string'||!Array.isArray(x.points)||x.points.some(p=>!Array.isArray(p)||p.length!==2||!p.every(Number.isFinite))))throw Error('問題データ形式が不正です');sets=v;index=0;load();document.querySelector('#status').textContent=`${sets.length}問を読み込みました。`}catch(err){document.querySelector('#status').textContent=err.message}};
document.querySelector('#next').onclick=()=>{index=(index+1)%sets.length;load()};document.querySelector('#reveal').onclick=()=>{reveal=!reveal;draw()};document.querySelector('#reset').onclick=()=>{rotation=initialRotation.slice();zoom=1;draw()};addEventListener('resize',draw);load();fetch('./coastline.json').then(r=>r.ok?r.json():[]).then(v=>{coastline=v;if(reveal)draw()}).catch(e=>console.warn('海岸線なしで続行',e));(async()=>{try{const r=await fetch('./questions.json',{cache:'no-cache'});if(!r.ok)return;const obj=await r.json();if(!Array.isArray(obj.sets)||obj.sets.length<4)return;sets=obj.sets;index=0;load();document.querySelector('#status').textContent=`収集済みの${sets.length}問を読み込みました。`; }catch(e){console.warn('同梱問題で続行',e)}})();</script></html>
